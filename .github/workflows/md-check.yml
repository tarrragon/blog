name: md-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  md-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: scripts/mdtools/go.mod
          cache-dependency-path: scripts/mdtools/go.sum

      - name: Build mdtools
        run: |
          mkdir -p bin
          (cd scripts/mdtools && go build -o ../../bin/mdtools .)

      # The lint and cards rules below are only as trustworthy as the code
      # deciding which files they apply to. Run the unit tests that pin that
      # scope before letting the tool pass judgment on content.
      - name: Test mdtools
        run: (cd scripts/mdtools && go vet ./... && go test ./...)

      - name: mdtools fmt --fix + auto-commit
        run: |
          ./bin/mdtools fmt --fix content/

          if git diff --quiet; then
            echo "No formatting changes needed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add content/
            git commit -m "style: mdtools fmt auto-fix"
            git push
            echo "::notice::Auto-fixed formatting and pushed"
          fi

      - name: mdtools lint
        run: ./bin/mdtools lint content/

      # cards 的孤兒卡檢查讀 data/autolink_terms.json；詞典過期時 L2 與網站都用舊詞典，
      # 本機的 pre-commit 沒跑時只有這一步擋得到。exit 1 是詞典過期；exit 2 也可能是 content/ 第一層
      # 資料夾沒有登記在 data/autolink.toml（訊息列出要改的資料夾）。
      - name: autolink dictionary up to date
        run: bin/autolink-dict --check

      - name: mdtools cards
        run: ./bin/mdtools cards content/

      # Hugo does not warn when an alias equals another page's URL (the page
      # silently wins), and cards does not read aliases.
      - name: alias collisions
        run: python3 bin/alias-check
